try{const c=JSON.parse(localStorage.getItem("bp_cache")||"null");if(c){W=Object.assign(W,c);W.loading=true}}catch(e){}
let tab="home",sub=null,kitSel="mochila",cat="agua",gsec="d",confirmaLimpar=false,pedidoInstalar=null,instalarFechado=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

/* ===== IDIOMA ===== */
let lang="pt",L=window.LANG.pt;
function pickLang(){const s=S.lang;if(s&&LOC[s])return s;const n=(navigator.language||"pt").slice(0,2).toLowerCase();return LOC[n]?n:"pt"}
function t(k,...a){let v=L.ui&&L.ui[k];if(v==null)v=LANG.pt.ui[k];if(v==null)return k;return a.length?v.replace(/\{(\d+)\}/g,(m,i)=>a[i]!=null?a[i]:""):v}
function rsk(k){const r=tx("risks",k);return r&&typeof r==="object"?r:null}
function tx(sec,k){const d=L[sec]&&L[sec][k];return d!=null?d:((LANG.pt[sec]||{})[k]!=null?LANG.pt[sec][k]:k)}
function loadLang(l){return new Promise(r=>{if(window.LANG[l])return r();const s=document.createElement("script");s.src="lang-"+l+".js";s.onload=r;s.onerror=r;document.head.appendChild(s)})}
async function setLang(l){await loadLang(l);if(!window.LANG[l])l="pt";lang=l;L=LANG[l];S.lang=l;save();document.documentElement.lang=l;$("#langCod").textContent=l.toUpperCase();relogio();fecharModal();render()}
function abrirIdiomas(){abrirModal(`<h2>🌐 Language · Idioma</h2>${LANGS.map(x=>`<button class="btn ${x[0]===lang?'':'s'}" onclick="setLang('${x[0]}')">${x[0]===lang?"✓ ":""}${x[2]}</button>`).join("")}<p class="stat">${esc(t("lang_note"))}</p>`)}
const fmt=(d,o)=>new Intl.DateTimeFormat(LOC[lang],Object.assign({timeZone:TZ},o)).format(d);
const agoraNaive=()=>new Date().toLocaleString("sv-SE",{timeZone:TZ}).replace(" ","T").slice(0,16);
const hm=ts=>ts?fmt(new Date(ts),{hour:"2-digit",minute:"2-digit"}):"";
const dhm=s=>{try{return fmt(new Date(s),{day:"2-digit",month:"2-digit",hour:"2-digit",minute:"2-digit"})}catch(e){return s}};
const dmy=s=>{try{return fmt(new Date(s+"T12:00:00"),{day:"2-digit",month:"2-digit",year:"numeric"})}catch(e){return s}};
const hoje=()=>agoraNaive().slice(0,10);
const dias=d=>Math.round((new Date(d+"T00:00:00")-new Date(hoje()+"T00:00:00"))/86400000);
const tel=n=>"tel:"+String(n).replace(/\s/g,"");
const tipoIpma=s=>{const k=String(s||"").toLowerCase().trim();return TIPOS[k]?t(TIPOS[k]):s};

/* ===== DADOS ===== */
async function getJSON(u,ms){const c=new AbortController(),tm=setTimeout(()=>c.abort(),ms||15000);try{const r=await fetch(u,{signal:c.signal,cache:"no-store"});if(!r.ok)throw new Error(r.status);return await r.json()}finally{clearTimeout(tm)}}
async function carregar(){
  W.loading=true;render();
  const metUrl=`https://api.open-meteo.com/v1/forecast?latitude=${CFG.LAT}&longitude=${CFG.LON}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,precipitation_probability_max,wind_gusts_10m_max&timezone=${encodeURIComponent(TZ)}&forecast_days=3`;
  const [a,m,v,u,bb]=await Promise.allSettled([
    getJSON("https://api.ipma.pt/open-data/forecast/warnings/warnings_www.json"),
    getJSON(metUrl),
    getJSON("avisos.json?t="+Date.now()),
    getJSON("ulpc.json?t="+Date.now()),
    getJSON("bombeiros.json?t="+Date.now())
  ]);
  let falhou=false;
  if(a.status==="fulfilled"&&Array.isArray(a.value)){W.ipma=a.value.filter(x=>x.idAreaAviso===CFG.AREA_IPMA).map(x=>({tipo:x.awarenessTypeName,nivel:x.awarenessLevelID,inicio:x.startTime,fim:x.endTime,texto:x.text||""}))}else falhou=true;
  if(m.status==="fulfilled"&&m.value&&m.value.daily){W.meteo=m.value.daily}else falhou=true;
  if(v.status==="fulfilled"){W.mun=v.value}
  if(u.status==="fulfilled"){W.ulpc=u.value}
  if(bb.status==="fulfilled"){W.bomb=bb.value}
  W.offline=falhou;W.loading=false;
  if(!falhou)W.ts=Date.now();
  try{localStorage.setItem("bp_cache",JSON.stringify({ipma:W.ipma,meteo:W.meteo,mun:W.mun,ulpc:W.ulpc,bomb:W.bomb,ts:W.ts}))}catch(e){}
  render();
}
function avisosIpma(){
  const ag=agoraNaive();
  return (W.ipma||[]).filter(x=>x.nivel&&x.nivel!=="green"&&NIVEL[x.nivel]&&!/agita/i.test(x.tipo||"")&&String(x.fim||"").slice(0,16)>ag).sort((p,q)=>NIVEL[q.nivel].n-NIVEL[p.nivel].n||String(p.inicio).localeCompare(String(q.inicio)));
}
function avisosMun(){
  const ag=new Date();
  return ((W.mun&&W.mun.avisos)||[]).filter(x=>x&&x.titulo&&(!x.validoAte||new Date(x.validoAte)>ag));
}
function cardAviso(a){return `<div class="alert ${NIVEL[a.nivel].c}"><b>⚠️ ${esc(t("aviso",t(NIVEL[a.nivel].k),tipoIpma(a.tipo)))}</b>${esc(a.texto)}<br><small>${dhm(a.inicio)} → ${dhm(a.fim)} · ${esc(t("fonte_ipma"))}${lang!=="pt"?" · "+esc(t("ipma_pt")):""}</small></div>`}
function cardMun(a){const c={vermelho:"r",laranja:"o",amarelo:"y"}[String(a.nivel||"").toLowerCase()]||"i";return `<div class="alert ${c}"><b>📣 ${esc(a.titulo)}</b>${esc(a.texto||"")}<br><small>${esc(t("mun_nome"))}${W.mun&&W.mun.atualizado?" · "+dhm(W.mun.atualizado):""}${lang!=="pt"?" · "+esc(t("mun_pt")):""}</small></div>`}
function blocoAvisos(){
  const M=avisosMun(),I=avisosIpma();
  let h=M.map(cardMun).join("")+I.map(cardAviso).join("");
  if(!h){h=W.ipma||W.mun?`<div class="alert g"><b>${esc(t("av_none_t"))}</b>${esc(t("av_none"))}</div>`:(W.loading?`<div class="alert i"><b>${esc(t("av_load"))}</b></div>`:`<div class="alert i"><b>${esc(t("av_off_t"))}</b>${esc(t("av_off"))} <a href="https://www.ipma.pt" target="_blank" rel="noopener">ipma.pt</a>.</div>`)}
  return h;
}
const corpos=()=>((W.bomb&&W.bomb.corporacoes)||[]).filter(c=>c&&c.nome);
const km=(a,b)=>{const R=6371,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dn=r(b.lon-a.lon),h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))};
function prioBomb(){
  const C=corpos();if(C.length<2)return null;
  const m=(W.bomb&&W.bomb.freguesias)||{};
  if(S.freg&&m[S.freg]&&C.some(c=>c.id===m[S.freg]))return {id:m[S.freg],por:"freguesia"};
  if(pos){let best=null;C.forEach(c=>{if(c.lat!=null&&c.lon!=null){const d=km(pos,{lat:+c.lat,lon:+c.lon});if(!best||d<best.d)best={id:c.id,d,por:"local"}}});return best}
  return null}
function localizar(){
  if(!navigator.geolocation){geoMsg=t("geo_no");render();return}
  geoMsg=t("geo_get");render();
  navigator.geolocation.getCurrentPosition(p=>{pos={lat:p.coords.latitude,lon:p.coords.longitude};geoMsg="";render()},()=>{geoMsg=t("geo_err");render()},{timeout:15000,maximumAge:60000})}
function blocoBombeiros(){
  const C=corpos(),Lc=CFG.LOCAL;
  if(!C.some(c=>c.contacto))return linha("🚒",t("c_bomb"),t("c_112"),[[t("c_local"),Lc.bombeiros]]);
  const pr=prioBomb(),ord=C.slice().sort((a,b)=>(pr&&b.id===pr.id?1:0)-(pr&&a.id===pr.id?1:0));
  const podeGeo=C.length>1&&C.every(c=>c.lat!=null&&c.lon!=null)&&!pos;
  const mapa=c=>{const q=c.lat!=null&&c.lon!=null?c.lat+","+c.lon:(c.morada?c.morada:"");return q?`<br><a href="https://www.google.com/maps?q=${encodeURIComponent(q)}" target="_blank" rel="noopener">${esc(t("b_route"))}</a>`:""};
  return `<div class="item" style="cursor:default;align-items:flex-start;flex-direction:column;gap:6px"><span><span style="font-size:24px">🚒</span> <b>${esc(t("c_bomb"))}</b><br><small class="mut">${esc(t("b_112"))}</small></span>
  ${ord.filter(c=>c.contacto||c.morada).map(c=>{const p=pr&&c.id===pr.id;return `<div style="width:100%;border:${p?"2px solid var(--ok)":"1px solid var(--line)"};border-radius:12px;padding:9px 11px;${p?"background:var(--okbg)":""}">${p?`<small style="color:var(--ok);font-weight:700">⭐ ${esc(pr.por==="local"?t("b_first_geo",pr.d.toFixed(1).replace(".",",")):t("b_first_freg"))}</small><br>`:""}<b>${esc(c.nome)}</b>${c.nota?" <small class='mut'>· "+esc(c.nota)+"</small>":""}${c.morada?"<br><small class='mut'>"+esc(c.morada)+"</small>":""}${c.contacto?`<br><a href="${tel(c.contacto)}">📞 ${esc(c.contacto)}</a>`:""}${c.email?`<br><a href="mailto:${esc(c.email)}">✉️ ${esc(c.email)}</a>`:""}${mapa(c)}</div>`}).join("")}
  ${podeGeo?`<button class="btn s" style="margin-top:2px" onclick="localizar()">📍 ${esc(t("b_nearest"))}</button>`:""}
  ${geoMsg?`<small class="mut">${esc(geoMsg)}</small>`:""}${pos?`<small class="mut">${esc(t("b_geo_priv"))}</small>`:""}</div>`}
function listaUlpc(){return ((W.ulpc&&W.ulpc.unidades)||[]).filter(x=>x&&x.freguesia)}
function ulpcSel(){return listaUlpc().find(x=>x.freguesia===S.freg)||null}

  const e=u.email?`<a href="mailto:${esc(u.email)}">✉️ ${esc(u.email)}</a><br>`:"";

function cardFreguesia(){

  <select aria-label="${esc(t("f_title"))}" onchange="S.freg=this.value;save();render()"><option value="">${esc(t("f_choose"))}</option>${Ls.map(x=>`<option value="${esc(x.freguesia)}" ${x.freguesia===S.freg?"selected":""}>${esc(x.freguesia)}</option>`).join("")}</select>
  ${sel?ulpcInfo(sel):`<p class="mut" style="margin-top:8px">${esc(t("f_hint"))}</p>`}</div>`}
function btnIpma(){
  const I=avisosIpma();let c="g",tt=t("ipma_none");
  if(!W.ipma){c="i";tt=W.loading?t("ipma_load"):t("ipma_off")}
  else if(I.length){const mx=Math.max(...I.map(a=>NIVEL[a.nivel].n));c=["","y","o","r"][mx];tt=(I.length>1?t("ipma_n",I.length):t("ipma_n1",I.length))+" · "+t(["","lvl_y","lvl_o","lvl_r"][mx])}

function abrirAvisos(){
  const I=avisosIpma();
  let h=I.map(cardAviso).join("");
  if(!h)h=W.ipma?`<div class="alert g"><b>${esc(t("av_none_t"))}</b>${esc(t("av_none_ipma"))}</div>`:`<div class="alert i"><b>${esc(t("av_off_t"))}</b>${esc(t("av_off"))} <a href="https://www.ipma.pt" target="_blank" rel="noopener">ipma.pt</a>.</div>`;
  abrirModal(`<h2>⚠️ ${esc(t("ipma_modal"))}</h2>${h}<p class="stat">${W.ts?esc(t("upd",hm(W.ts)))+" ":""}${esc(t("fonte"))}</p><button class="btn s" onclick="fecharModal()">${esc(t("close"))}</button>`)}
function abrirModal(h){fecharModal();const m=document.createElement("div");m.className="modal";m.id="modal";m.onclick=e=>{if(e.target===m)fecharModal()};m.innerHTML=`<div class="sheet" role="dialog" aria-modal="true">${h}</div>`;document.body.appendChild(m)}
function fecharModal(){const m=$("#modal");if(m)m.remove()}
function blocoMeteo(){
  const d=W.meteo;
  if(!d)return `<div class="card"><h3>${esc(t("meteo_t"))}</h3><p class="mut">${esc(W.loading?t("meteo_load"):t("meteo_off"))}</p></div>`;
  const nomes=[t("d0"),t("d1"),t("d2")];
  const dia=i=>{const w=WMO[d.weather_code[i]]||["❔",null];const p=d.precipitation_sum[i],pp=d.precipitation_probability_max[i],r=d.wind_gusts_10m_max[i];
    return `<div><div class="d">${esc(nomes[i])}</div><div class="e">${w[0]}</div><div class="t">${Math.round(d.temperature_2m_max[i])}° <small>${Math.round(d.temperature_2m_min[i])}°</small></div><div class="p">${esc(w[1]?t(w[1]):"—")}<br>💧 ${p!=null?Math.round(p*10)/10:"–"} mm${pp!=null?" ("+pp+"%)":""}<br>💨 ${r!=null?Math.round(r):"–"} km/h</div></div>`};
  return `<div class="card"><h3>${esc(t("meteo_t"))}</h3><div class="wx">${[0,1,2].map(dia).join("")}</div><p class="stat">${esc(W.offline?t("meteo_cached",hm(W.ts)):t("upd",hm(W.ts)))} ${esc(t("meteo_foot"))}</p></div>`;
}

/* ===== INSTALAÇÃO ===== */
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
const ios=()=>/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==="MacIntel"&&navigator.maxTouchPoints>1);
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();pedidoInstalar=e;if($("#modal-inst"))popupInstalar(true);if(tab==="home"&&!$("#modal"))render()});
window.addEventListener("appinstalled",()=>{pedidoInstalar=null;fecharModal();render()});
async function instalar(){if(!pedidoInstalar)return;pedidoInstalar.prompt();try{const r=await pedidoInstalar.userChoice;if(r&&r.outcome==="accepted"){fecharModal()}}catch(e){}pedidoInstalar=null;render()}
function passosInstalar(){
  if(pedidoInstalar)return `<button class="btn" onclick="instalar()">${esc(t("i_now"))}</button>`;
  return ios()?`<ol><li>${t("i_ios1")}</li><li>${t("i_ios2")}</li><li>${t("i_ios3")}</li></ol>`:`<ol><li>${t("i_and1")}</li><li>${t("i_and2")}</li><li>${t("i_and3")}</li></ol>`;
}
function popupInstalar(atualizar){
  if(standalone())return;
  if(!atualizar&&(instalarFechado||$("#modal")))return;
  abrirModal(`<div id="modal-inst"><img class="logo" src="icon-192.png" alt=""><h2>${esc(t("i_title"))}</h2><p class="mut">${esc(t("i_text"))}</p>${passosInstalar()}<button class="btn s" onclick="instalarFechado=true;fecharModal()">${esc(t("i_later"))}</button></div>`);

function cardInstalar(){

  return `<div class="card"><h3>📲 ${esc(t("i_card_t"))}</h3><p class="mut">${esc(t("i_card_d"))}</p><button class="btn" onclick="instalarFechado=false;popupInstalar()">${esc(t("i_how"))}</button></div>`;
}

/* ===== KITS ===== */
const kitItems=k=>Object.values(KITS[k].cats).flat();
const kTot=k=>kitItems(k).length;
const kDone=k=>kitItems(k).filter(id=>(S.k[k]||{})[id]).length;
const kPct=k=>Math.round(kDone(k)/kTot(k)*100);
function expiring(){const o=[];for(const k of KITKEYS)for(const id of kitItems(k)){const v=S.val[k+"|"+id];if(v){const n=dias(v);if(n<=30)o.push({k,id,n})}}return o.sort((a,b)=>a.n-b.n)}
function tick(k,id,v){S.k[k]=S.k[k]||{};S.k[k][id]=v;save();render()}
function setVal(k,id,v){if(v)S.val[k+"|"+id]=v;else delete S.val[k+"|"+id];save();render()}
function limpar(){if(!confirmaLimpar){confirmaLimpar=true;render();return}S.k[kitSel]={};kitItems(kitSel).forEach(id=>delete S.val[kitSel+"|"+id]);confirmaLimpar=false;save();render()}
function setKit(k){kitSel=k;cat=Object.keys(KITS[k].cats)[0];confirmaLimpar=false;render()}
function marcarRev(){S.rev=hoje();save();render()}
function badgeVal(v){const n=dias(v);if(n<0)return `<small class="bdg r">${esc(t("v_expired"))}</small>`;if(n<=30)return `<small class="bdg o">${esc(t("v_soon",n))}</small>`;return ""}
function kit(){
  const cats=Object.keys(KITS[kitSel].cats);if(!cats.includes(cat))cat=cats[0];
  const p=kPct(kitSel),rev=S.rev,vencida=!rev||dias(rev)<-180;
  const ex=expiring();
  return `<div class="card"><h2>${esc(t("kit_title"))}</h2><p class="mut">${esc(t("kit_intro"))}</p><p class="priv">${esc(t("priv"))}</p></div>
  <div class="tabs">${KITKEYS.map(k=>`<button class="${k===kitSel?'on':''}" onclick="setKit('${k}')">${KITS[k].i} ${esc(tx("kits",k))}</button>`).join("")}</div>
  <div class="card"><h3>${KITS[kitSel].i} ${esc(tx("kits",kitSel))}</h3><p class="mut">${esc(tx("kitd",kitSel))}</p><div class="bar"><i style="width:${p}%"></i></div><p class="mut" style="margin-top:6px">${kDone(kitSel)} / ${kTot(kitSel)} · ${p}%</p></div>
  <div class="tabs">${cats.map(c=>`<button class="${c===cat?'on':''}" onclick="cat='${c}';render()">${esc(tx("cats",c))}</button>`).join("")}</div>
  <div class="card">${KITS[kitSel].cats[cat].map(id=>{const ok=(S.k[kitSel]||{})[id],v=S.val[kitSel+"|"+id]||"";
    return `<div class="item2"><label class="item ${ok?'done':''}"><input type="checkbox" ${ok?'checked':''} onchange="tick('${kitSel}','${id}',this.checked)"><span>${esc(tx("items",id))}</span></label>${EXP.has(id)?`<div class="vrow"><span>📅 ${esc(t("v_label"))}</span><input type="date" value="${esc(v)}" onchange="setVal('${kitSel}','${id}',this.value)" aria-label="${esc(t("v_label"))}">${v?badgeVal(v):""}</div>`:""}</div>`}).join("")}</div>
  ${ex.length&&tab==="kit"?`<div class="alert o"><b>⏰ ${esc(t("v_alert",ex.length))}</b>${ex.slice(0,6).map(x=>esc(tx("kits",x.k)+": "+tx("items",x.id)+" · "+(x.n<0?t("v_expired"):t("v_soon",x.n)))).join("<br>")}</div>`:""}
  <div class="card"><h3>🔁 ${esc(t("rev_t"))}</h3><p class="mut">${esc(t("rev_d"))}</p><p class="mut" style="margin-top:6px">${rev?esc(t("rev_last",dmy(rev))):esc(t("rev_never"))}</p>${vencida&&kDone(kitSel)>0?`<div class="alert y" style="margin:8px 0 0">${esc(t("rev_due"))}</div>`:""}<button class="btn s" onclick="marcarRev()">${esc(t("rev_btn"))}</button></div>
  <p class="foot">${esc(t("kit_tip"))}</p>
  <button class="btn s" onclick="limpar()">${esc(confirmaLimpar?t("clear_confirm"):t("clear"))}</button>`;
}

/* ===== PLANO DA FAMÍLIA ===== */
function addP(){const n=$("#pn").value.trim();if(!n)return;S.plan.pessoas.push({n,t:$("#pt").value.trim(),o:$("#po").value.trim()});save();render()}
function setP(k,v){S.plan[k]=v;save()}
function setPt(i,v){S.plan.pontos[i].t=v;save()}
function evTick(i,v){S.plan.ev[i]=v;save();render()}
function guardarLoc(i){
  if(!navigator.geolocation){alert(t("geo_no"));return}
  navigator.geolocation.getCurrentPosition(p=>{S.plan.pontos[i].lat=p.coords.latitude;S.plan.pontos[i].lon=p.coords.longitude;save();render()},()=>alert(t("geo_err")),{timeout:15000,maximumAge:60000})}
function limparLoc(i){delete S.plan.pontos[i].lat;delete S.plan.pontos[i].lon;save();render()}
function linkMapa(p){const q=p.lat!=null?p.lat+","+p.lon:(p.t||"");return q?"https://www.google.com/maps?q="+encodeURIComponent(q):""}
function cartaoTexto(){
  const P=S.plan,o=[];
  o.push("Braga Resiliente — "+t("card_t"));
  o.push("112 · "+t("card_112"));
  o.push(CFG.TEL_MUNICIPAL+" · "+t("mun_t"));
  if(P.morada)o.push(t("p_morada")+": "+P.morada);
  P.pessoas.forEach(x=>o.push("• "+x.n+(x.t?" · "+x.t:"")+(x.o?" ("+x.o+")":"")));
  if(P.fora)o.push(t("p_fora")+": "+P.fora);
  P.pontos.forEach((x,i)=>{if(x.t||x.lat!=null)o.push(t("pt"+(i+1))+": "+(x.t||"")+(x.lat!=null?" "+linkMapa(x):""))});
  if(P.mochila)o.push(t("p_mochila")+": "+P.mochila);
  if(P.desligar)o.push(t("p_desligar")+": "+P.desligar);
  return o.join("\n")}
function abrirCartao(){
  const P=S.plan;
  const lin=(a,b)=>b?`<div class="cl"><b>${esc(a)}</b><span>${esc(b)}</span></div>`:"";
  abrirModal(`<div class="cartao"><h2>🪪 ${esc(t("card_t"))}</h2>
   <div class="cl big"><b>112</b><span>${esc(t("card_112"))}</span></div>
   <div class="cl big"><b>${esc(CFG.TEL_MUNICIPAL)}</b><span>${esc(t("mun_t"))}</span></div>
   ${lin(t("p_morada"),P.morada)}
   ${P.pessoas.length?`<h3>${esc(t("p_pessoas"))}</h3>${P.pessoas.map(x=>`<div class="cl"><b>${esc(x.n)}</b><span>${esc(x.t||"")}${x.o?" · "+esc(x.o):""}</span></div>`).join("")}`:""}
   ${lin(t("p_fora"),P.fora)}
   ${P.pontos.map((x,i)=>lin(t("pt"+(i+1)),(x.t||"")+(x.lat!=null?" 📍":""))).join("")}
   ${lin(t("p_mochila"),P.mochila)}${lin(t("p_desligar"),P.desligar)}
   <p class="stat">${esc(t("card_foot"))}</p></div>
   <button class="btn noprint" onclick="window.print()">🖨️ ${esc(t("card_print"))}</button>
   ${navigator.share?`<button class="btn s noprint" onclick="navigator.share({title:'Braga Resiliente',text:cartaoTexto()}).catch(()=>{})">📤 ${esc(t("card_share"))}</button>`:""}
   <button class="btn s noprint" onclick="fecharModal()">${esc(t("close"))}</button>`)}
function plan(){
  const P=S.plan,ev=P.ev||{},evDone=EVAC.filter((x,i)=>ev[i]).length;
  const pt=(x,i)=>`<div class="pto"><label class="f">${esc(t("pt"+(i+1)))}</label><input type="text" value="${esc(x.t||"")}" oninput="setPt(${i},this.value)" placeholder="${esc(t("pt_ph"))}">
    <div class="ptb">${x.lat!=null?`<a href="${linkMapa(x)}" target="_blank" rel="noopener">🗺️ ${esc(t("pt_map"))}</a> <button class="lnk" onclick="limparLoc(${i})">${esc(t("pt_rm"))}</button>`:`<button class="lnk" onclick="guardarLoc(${i})">📍 ${esc(t("pt_here"))}</button>${x.t?` <a href="${linkMapa(x)}" target="_blank" rel="noopener">🗺️ ${esc(t("pt_map"))}</a>`:""}`}</div></div>`;
  return `<div class="card"><h2>${esc(t("plan_title"))}</h2><p class="mut">${esc(t("plan_intro"))}</p><p class="priv">${esc(t("priv"))}</p></div>
  <div class="card"><h3>👨‍👩‍👧 ${esc(t("p_pessoas"))}</h3>
   ${P.pessoas.map((x,i)=>`<div class="item" style="cursor:default"><span style="flex:1"><b>${esc(x.n)}</b> ${x.t?`<a href="${tel(x.t)}">${esc(x.t)}</a>`:""}${x.o?`<br><small class="mut">${esc(x.o)}</small>`:""}</span><button class="del" aria-label="${esc(t("remove"))}" onclick="S.plan.pessoas.splice(${i},1);save();render()">✕</button></div>`).join("")||`<p class="mut">${esc(t("p_nobody"))}</p>`}
   <div class="row" style="margin-top:8px"><input type="text" id="pn" placeholder="${esc(t("p_name"))}" aria-label="${esc(t("p_name"))}"><input type="tel" id="pt" placeholder="${esc(t("p_phone"))}" aria-label="${esc(t("p_phone"))}"></div>
   <input type="text" id="po" style="margin-top:8px" placeholder="${esc(t("p_notes"))}" aria-label="${esc(t("p_notes"))}">
   <button class="btn s" onclick="addP()">+ ${esc(t("p_add"))}</button></div>
  <div class="card"><h3>📞 ${esc(t("p_fora"))}</h3><input type="text" value="${esc(P.fora)}" oninput="setP('fora',this.value)" placeholder="${esc(t("p_fora_ph"))}"><p class="mut" style="margin-top:6px">${esc(t("p_fora_d"))}</p></div>
  <div class="card"><h3>📍 ${esc(t("pt_title"))}</h3><p class="mut">${esc(t("pt_intro"))}</p>${P.pontos.map(pt).join("")}<p class="stat">${esc(t("pt_priv"))}</p></div>
  <div class="card"><h3>🏠 ${esc(t("p_casa"))}</h3>
   <label class="f">${esc(t("p_morada"))}</label><input type="text" value="${esc(P.morada)}" oninput="setP('morada',this.value)" placeholder="${esc(t("p_morada_ph"))}">
   <label class="f">${esc(t("p_mochila"))}</label><input type="text" value="${esc(P.mochila)}" oninput="setP('mochila',this.value)" placeholder="${esc(t("p_mochila_ph"))}">
   <label class="f">${esc(t("p_desligar"))}</label><input type="text" value="${esc(P.desligar)}" oninput="setP('desligar',this.value)" placeholder="${esc(t("p_desligar_ph"))}"></div>
  <div class="card"><h3>🚪 ${esc(t("ev_title"))}</h3><p class="mut">${esc(t("ev_intro"))}</p>
   ${EVAC.map((k,i)=>`<label class="item ${ev[i]?'done':''}"><input type="checkbox" ${ev[i]?'checked':''} onchange="evTick(${i},this.checked)"><span>${esc(t(k))}</span></label>`).join("")}
   <p class="mut" style="margin-top:6px">${evDone} / ${EVAC.length}</p></div>
  <button class="btn" onclick="abrirCartao()">🪪 ${esc(t("card_btn"))}</button>
  `;
}

/* ===== ECRÃS ===== */
function nav(){const tem=avisosIpma().length+avisosMun().length>0;$("#nav").innerHTML=TABS.map(x=>`<button class="${tab===x[0]?'on':''}" onclick="go('${x[0]}')"><span class="i">${x[1]}${x[0]==="warn"&&tem?'<i class="pt"></i>':''}</span>${esc(t("nav_"+x[0]))}</button>`).join("")}
function relogio(){const d=new Date();$("#rHora").textContent=fmt(d,{hour:"2-digit",minute:"2-digit",hourCycle:"h23"});$("#rData").textContent=fmt(d,{weekday:"short",day:"numeric",month:"short"}).replace(/\./g,"")}
function go(tb,s){tab=tb;sub=s||null;confirmaLimpar=false;if(tb==="guide")gsec="d";render();$("#main").scrollTop=0}
const sos=()=>`<a class="sos" href="tel:112"><b>📞 112</b><span>${esc(t("sos"))}</span></a>`;
const sosMun=()=>`<a class="mun" href="${tel(CFG.TEL_MUNICIPAL)}"><b>📞 ${esc(CFG.TEL_MUNICIPAL)}</b><span><strong>${esc(t("mun_t"))}</strong>, ${esc(t("mun_d"))}<br>${esc(t("mun_e"))}</span></a>`;

function home(){
  const ex=expiring();
  return sos()+sosMun()+avisosMun().map(cardMun).join("")+btnIpma()+blocoMeteo()+
  (ex.length?`<button class="avbtn o" onclick="go('kit')"><span>⏰ <b>${esc(t("v_alert",ex.length))}</b><br><small>${esc(tx("items",ex[0].id))} · ${esc(ex[0].n<0?t("v_expired"):t("v_soon",ex[0].n))}</small></span><span class="chev">›</span></button>`:"")+
  `<div class="grid">
   <button class="tile" onclick="go('kit')"><span class="i">🎒</span><b>${esc(t("h_kits"))}</b><small>${esc(tx("kits","mochila"))}: ${kDone("mochila")} / ${kTot("mochila")}</small><div class="bar"><i style="width:${kPct("mochila")}%"></i></div></button>
   <button class="tile" onclick="go('plan')"><span class="i">👨‍👩‍👧</span><b>${esc(t("h_plan"))}</b><small>${esc(S.plan.pessoas.length?t("h_people",S.plan.pessoas.length):t("h_todo"))}</small></button>
   <button class="tile" onclick="go('guide')"><span class="i">📖</span><b>${esc(t("h_guides"))}</b><small>${esc(t("h_guides_d"))}</small></button>
   <button class="tile" onclick="go('warn','contactos')"><span class="i">📞</span><b>${esc(t("h_contacts"))}</b><small>${esc(t("h_contacts_d"))}</small></button>
  </div>`+cardInstalar()+
  cardFreguesia()+
  `<p class="foot">${esc(t("foot"))}</p>`;
}
function linha(ic,nome,desc,tels){
  return `<div class="item" style="cursor:default;align-items:flex-start"><span style="font-size:24px">${ic}</span><span style="flex:1"><b>${esc(nome)}</b><br><small class="mut">${esc(desc)}</small>${tels.filter(x=>x[1]).map(x=>`<br><a href="${tel(x[1])}">📞 ${esc(x[1])}</a> <small class="mut">${esc(x[0])}</small>`).join("")}</span></div>`}
function contactos(){
  const Lc=CFG.LOCAL;
  return `<button class="back" onclick="go('warn')">‹ ${esc(t("nav_warn"))}</button>`+sos()+sosMun()+
  `<div class="card"><h2>${esc(t("h_contacts"))}</h2><p class="mut">${esc(t("c_intro"))}</p>
  ${blocoBombeiros()}
  ${linha("👮",t("c_psp"),t("c_112"),[[t("c_local"),Lc.psp]])}
  ${linha("🛡️","GNR",t("c_112"),[[t("c_local"),Lc.gnr]])}
  ${linha("🚔",t("c_pm"),"R. do Farto, 4700-426 Braga",[[t("c_local"),"253 609 740"]])}
  ${linha("🏥",t("c_hosp"),t("c_hosp_d"),[[t("c_hosp_t"),CFG.HOSPITAL_TEL]])}
  ${linha("➕",t("c_cv"),t("c_cv_d"),[[t("c_noemerg"),CFG.CRUZ_VERMELHA_TEL]])}
  ${linha("🩺",t("c_s24"),t("c_s24_d"),[["",'808 24 24 24']])}
  ${ulpcSel()?linha("🛟","ULPC · "+ulpcSel().freguesia,t("c_ulpc_d"),[[t("c_noemerg"),ulpcSel().contacto]]):""}
  ${Lc.smpc?linha("🛟",t("c_smpc"),t("c_smpc_d"),[[t("c_noemerg"),Lc.smpc]]):""}
  </div>`;
}
function warn(){
  if(sub==="contactos")return contactos();
  return `<div class="card"><h2>${esc(t("nav_warn"))}</h2><p class="mut">${esc(t("w_intro"))}</p></div>`+blocoAvisos()+
  `<button class="btn s" onclick="carregar()">${esc(W.loading?t("w_updating"):t("w_update"))}</button>
  <button class="btn" onclick="go('warn','contactos')">📞 ${esc(t("h_contacts"))}</button>
  <p class="foot">${W.ts?esc(t("w_last",hm(W.ts)))+" ":""}${esc(t("w_sources"))}</p>`;
}

/* ===== GUIAS ===== */
function guide(){
  if(sub&&GUIDES[sub]){
    const g=tx("guides",sub),rk0=rsk(sub),secs=[["a","g_antes"],["d","g_durante"],["p","g_depois"]],ic=GUIDES[sub];
    const lista=(g&&g[gsec])||[];
    return `<button class="back" onclick="go('guide')">‹ ${esc(t("nav_guide"))}</button><div class="card"><h2>${ic} ${esc(g.n)}</h2>${rk0?`<p class="mut">${esc(rk0.t)}</p>`:""}
    <div class="tabs">${secs.map(s=>`<button class="${s[0]===gsec?'on':''}" onclick="gsec='${s[0]}';render()">${esc(t(s[1]))}</button>`).join("")}</div>
    ${lista.map((x,i)=>`<div class="step"><em>${i+1}</em><span>${esc(x)}</span></div>`).join("")}</div><div style="margin-top:12px">${sos()}${sosMun()}</div>`}
  return `<div class="card"><h2>${esc(t("guide_title"))}</h2><p class="mut">${esc(t("guide_intro"))}</p></div>
  <div class="grid">${Object.keys(GUIDES).sort((x,y)=>tx("guides",x).n.localeCompare(tx("guides",y).n,lang)).map(k=>{const rk=rsk(k);return `<button class="tile" onclick="go('guide','${k}')"><span class="i">${GUIDES[k]}</span><b>${esc(tx("guides",k).n)}</b>${rk?`<small class="mut" style="font-weight:400;line-height:1.3;margin-top:4px;text-align:left">${esc(rk.t)}</small>`:""}</button>`}).join("")}</div>
  <p class="stat">${esc(t("risk_src"))}</p>`;
}
function render(){const y=$("#main").scrollTop;$("#hsub").textContent=t("sub");nav();$("#main").innerHTML={home,kit,plan,warn,guide}[tab]();$("#main").scrollTop=y}

(async function arranque(){
  lang=pickLang();await loadLang(lang);if(!window.LANG[lang])lang="pt";L=LANG[lang];
  document.documentElement.lang=lang;$("#langCod").textContent=lang.toUpperCase();
  $("#btnLang").onclick=abrirIdiomas;
  const aplicaTema=()=>{const d=document.documentElement.dataset.theme;$("#btnTema").textContent=d==="dark"?"☀️":"🌙";$("#metaTema").content=d==="dark"?"#0b1220":"#0b5cab"};
  $("#btnTema").onclick=()=>{const n=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=n;try{localStorage.setItem("bp_theme",n)}catch(e){}aplicaTema()};aplicaTema();
  relogio();setInterval(relogio,15000);
  render();carregar();setTimeout(()=>popupInstalar(),1200);
})();
document.addEventListener("visibilitychange",()=>{if(!document.hidden&&(!W.ts||Date.now()-W.ts>600000))carregar()});
if("serviceWorker" in navigator&&location.protocol==="https:")window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
</body>
